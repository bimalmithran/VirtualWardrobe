# Backend:  docker compose up --build -d            -> API on :8080, Postgres+pgvector on 127.0.0.1:5432
# APK:      docker compose --profile apk run --rm apk -> frontend/dist/VirtualWardrobe-release.apk
#
# Values come from ./.env (see frontend/.env.example). Compose interpolates them, and the APK
# service passes EXPO_PUBLIC_API_URL to the Expo bundler.
name: virtualwardrobe

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: wardrobe
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wardrobe}
      POSTGRES_DB: wardrobe
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs on first start of an empty volume. The API also applies it (idempotently) at boot.
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    ports:
      - "127.0.0.1:5432:5432" # local psql only; not exposed to the LAN
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wardrobe -d wardrobe"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgres://wardrobe:${POSTGRES_PASSWORD:-wardrobe}@db:5432/wardrobe?sslmode=disable
      # Leave empty to build image URLs from the Host header the phone used.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      LLM_COST_CEILING_USD: ${LLM_COST_CEILING_USD:-0.01}
      # Cloud vision for low-end phones. Models (~56 MB) download into the volume on first boot.
      VISION_ENABLED: ${VISION_ENABLED:-true}
      VISION_SEGMENTATION: ${VISION_SEGMENTATION:-rmbg-1.4}
      # AI stylist: Claude when a key is set, else the built-in basic stylist.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      STYLIST_MODEL: ${STYLIST_MODEL:-claude-opus-5-5}
      # Monetisation (all optional; see INSTALL.md).
      REVENUECAT_WEBHOOK_AUTH: ${REVENUECAT_WEBHOOK_AUTH:-}
      AFFILIATE_SECRET: ${AFFILIATE_SECRET:-}
      AMAZON_ASSOCIATE_TAG: ${AMAZON_ASSOCIATE_TAG:-}
      AFFILIATE_LINK_WRAPPER: ${AFFILIATE_LINK_WRAPPER:-}
      AFFILIATE_PARTNERS: ${AFFILIATE_PARTNERS:-}
      PREMIUM_FOR_ALL: ${PREMIUM_FOR_ALL:-true}
    volumes:
      - uploads:/data/uploads
      - models:/data/models
    ports:
      - "8080:8080" # all interfaces, so a phone on the same Wi-Fi can reach it
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  apk:
    profiles: ["apk"] # never started by a plain `docker compose up`
    build: ./frontend/docker
    environment:
      EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL:-}
      HOST_UID: ${HOST_UID:-1000}
      HOST_GID: ${HOST_GID:-1000}
    volumes:
      - ./frontend:/src:ro
      - ./frontend/dist:/out
      - gradle-cache:/root/.gradle
      - npm-cache:/root/.npm

volumes:
  pgdata:
  uploads:
  models:
  gradle-cache:
  npm-cache:
